<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps WebApp</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        p {
            color: #555;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>DevOps WebApp - CI/CD Live</h1>

        <p>End-to-End CI/CD Automation</p>

        <p>GitHub Actions + Slack + Netlify</p>

        <div class="status">
            Deployment Successful 🚀
        </div>
    </div>

</body>
</html>
