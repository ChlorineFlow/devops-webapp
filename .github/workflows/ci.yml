name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Show Build Output
        run: ls -la dist

      - name: Send Success Notification
        if: success()
        run: |
          curl -X POST \
          -H "Content-type: application/json" \
          --data '{"text":"✅ CI Pipeline SUCCESS - devops-webapp build and tests completed successfully."}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Send Failure Notification
        if: failure()
        run: |
          curl -X POST \
          -H "Content-type: application/json" \
          --data '{"text":"❌ CI Pipeline FAILED - devops-webapp build or tests failed. Check GitHub Actions logs."}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"